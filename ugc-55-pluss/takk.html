<style>

:root{
  /* ===== AVE-palett (Daikin-blå + kjølig nøytral) ===== */
  --cream:#F5F1EC; --sand:#FBF9F6; --white:#fff;
  --ink:#232832; --ink2:#363C47; --muted:#6B6F78; --line:#E6DFD6;
  --clay:#B0624E; --clay-deep:#8A4535; --clay-soft:#D49A88; --clay-tint:#F6E9E4;
  --dark:#232832; --dark-deep:#16191F;
  --gold:#E5A11B; --red:#C0584A;
  --mont:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:18px; --rs:14px; --pill:999px;
  --sh:0 24px 54px -32px rgba(12,32,51,.42);
  --sh-sm:0 14px 30px -22px rgba(12,32,51,.32);
  --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:var(--mont);color:var(--ink);background:var(--cream);font-size:1.02rem;line-height:1.6;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--mont);font-weight:800;line-height:1.08;letter-spacing:-0.01em;overflow-wrap:break-word}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.section{padding:64px 0}
@media(max-width:760px){.section{padding:44px 0}}
.eyebrow{display:inline-block;font-size:0.74rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--clay-deep)}
.eyebrow.muted{color:var(--muted)}
.h-xl{font-size:clamp(1.95rem,4.4vw,3.0rem)}
.h-lg{font-size:clamp(1.6rem,3.1vw,2.3rem)}
.lede{font-size:1.0rem;color:var(--muted);max-width:58ch}
.center{text-align:center}

/* ---- buttons (malens pill: aksentfarge, hvit bold + sirkulær pil, subtekst) ---- */
.cta{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--clay);color:#fff;border:0;cursor:pointer;border-radius:var(--pill);padding:16px 40px;line-height:1.15;transition:.2s;box-shadow:0 16px 30px -18px rgba(150,81,62,.6)}
.cta:hover{background:var(--clay-deep);transform:translateY(-2px)}
.cta .t{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.cta .t .arw{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);display:inline-flex;align-items:center;justify-content:center}
.cta .t .arw svg{width:13px;height:13px}
.cta .sub{font-size:0.74rem;font-weight:500;opacity:.85}
.cta.lg{padding:18px 48px}
.cta.lg .t{font-size:1.14rem}
.btn-soft{display:inline-flex;align-items:center;gap:9px;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--pill);padding:13px 24px;font-weight:600;font-size:0.9rem;cursor:pointer;transition:.2s}
.btn-soft:hover{border-color:var(--clay);color:var(--clay-deep)}
.btn-soft svg{width:16px;height:16px}

/* ---- top bar (wordmark + rating) ---- */
.topbar{background:var(--cream);text-align:center;padding:16px 16px 11px}
.topbar .wordmark{display:inline-block;font-size:1.32rem;letter-spacing:.42em;color:var(--ink);line-height:1;margin-bottom:9px;font-weight:600;text-indent:.42em}
.topbar .rate{display:flex;align-items:center;justify-content:center;gap:7px;font-size:0.92rem;font-weight:600;color:var(--ink)}
.topbar .stars{color:var(--gold);letter-spacing:1px;font-size:0.98rem}
.topbar .rate small{color:var(--muted);font-weight:500}
/* ---- campaign strip ---- */
.strip{background:var(--dark);color:#fff;text-align:center;padding:13px 16px;font-size:1.0rem;font-weight:700;letter-spacing:.02em}
.strip .hl{color:#EFB65C}
@media(max-width:600px){.strip{font-size:0.88rem}}
/* ---- hero ---- */
.hero{position:relative;padding:34px 0 56px;background:url('img/hero.jpg') 70% 60%/cover no-repeat;background-color:var(--dark)}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(22,25,31,.95) 0%,rgba(22,25,31,.90) 34%,rgba(22,25,31,.66) 60%,rgba(22,25,31,.40) 82%,rgba(22,25,31,.26) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.hero h1{color:#fff;text-shadow:0 2px 16px rgba(22,25,31,.55)}
/* grid-areas: på mobil skal skjemaet ligge RETT under H1 (above the fold —
   Victors krav 17.08.2026); checkliste + tilbuds-tiles flyttes under skjemaet */
.hero-grid{display:grid;grid-template-columns:1.04fr 0.96fr;grid-template-areas:"head form" "rest form";gap:0 40px;align-items:start}
.hero-head{grid-area:head}
.hero-form{grid-area:form}
.hero-rest{grid-area:rest}
.hero h1{margin:4px 0 18px}
.hero .blist{list-style:none;display:grid;gap:11px;margin:0 0 22px}
.hero .blist li{display:flex;align-items:center;gap:11px;font-size:1.0rem;font-weight:600;color:#fff;text-shadow:0 1px 10px rgba(18,14,12,.6)}
.chk{width:22px;height:22px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;flex:none}
.chk svg{width:12px;height:12px;stroke:#fff}

/* ---- offer visual (behandlingen + kampanjeprisen = tilbudet) ---- */
.offer{display:flex;align-items:stretch;gap:12px;max-width:440px}
.offer .tile{position:relative;flex:1;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 12px 13px;text-align:center;box-shadow:var(--sh-sm)}
.offer .tile img{height:104px;width:100%;object-fit:cover;object-position:center 30%;border-radius:10px;margin:0 auto 9px}
.offer .tile .big{display:flex;align-items:center;justify-content:center;height:104px;margin:0 auto 9px;font-size:2.2rem;font-weight:800;letter-spacing:-0.03em;color:var(--clay-deep)}
.offer .tile b{display:block;font-size:0.9rem;font-weight:700;line-height:1.25}
.offer .tile .pr{display:block;font-size:0.8rem;color:var(--muted);margin-top:2px}
.offer .tile .pr s{color:var(--red);white-space:nowrap}
.offer .plus{align-self:center;width:34px;height:34px;border-radius:50%;background:var(--clay);color:#fff;font-weight:800;font-size:1.25rem;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh-sm)}
.offer .freebadge{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--clay);color:#fff;font-size:0.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:var(--pill);padding:4px 12px;white-space:nowrap}
.offer-note{font-size:0.86rem;font-weight:600;color:#EFB65C;margin-top:12px;text-shadow:0 1px 8px rgba(18,14,12,.5)}
.offer-note span{color:rgba(255,255,255,.85);font-weight:500}
@media(max-width:480px){.offer{gap:9px}.offer .tile img,.offer .tile .big{height:84px}.offer .tile .big{font-size:1.8rem}.offer .plus{width:28px;height:28px;font-size:1.05rem}}

/* hero form card — GF-malens native skjema (Victors beslutning 17.08.2026:
   GHL-embedden så rotete ut; native felter + stram spacing som Generalfinans) */
.formcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 18px;box-shadow:var(--sh)}
.formcard .fhead b{display:block;font-size:1.14rem;font-weight:800;letter-spacing:-0.01em}
.formcard .fhead span{display:block;font-size:0.82rem;color:var(--muted);margin:5px 0 14px}
.field{margin-bottom:11px}
.field label{display:block;font-size:0.78rem;font-weight:700;margin-bottom:4px}
.field label .req{color:var(--clay-deep)}
.field .inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--sand);overflow:hidden}
.field .inp:focus-within{border-color:var(--clay);background:#fff}
.field .flag{padding:0 10px;font-size:1.05rem;border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.field input{flex:1;width:100%;padding:11px 13px;border:0;background:transparent;font-family:var(--mont);font-size:0.95rem;color:var(--ink)}
.field input:focus{outline:none}
.formcard .cta{width:100%;margin-top:6px;padding:14px 32px}
.fmsg{display:none;background:var(--clay-tint);border:1px solid var(--clay-soft);color:#7A4433;padding:13px 15px;border-radius:12px;font-size:0.9rem;margin-bottom:14px;font-weight:600}
.formcard .fine{display:block;font-size:0.74rem;color:var(--muted);margin-top:11px;text-align:center}
@media(max-width:900px){
  .hero{padding:22px 0 42px}
  .hero-grid{grid-template-columns:1fr;grid-template-areas:"head" "form" "rest";gap:0}
  .hero-head h1{margin-bottom:14px}
  .hero-form{margin-bottom:24px}
}
@media(max-width:480px){
  .h-xl{font-size:1.75rem}
}

/* ---- split (image + text) ---- */
.split{display:grid;grid-template-columns:1fr 1.05fr;gap:46px;align-items:center}
.split.rev .s-media{order:2}
@media(max-width:880px){.split{grid-template-columns:1fr;gap:30px}.split.rev .s-media{order:0}}
@media(max-width:880px){.split[style*="1fr 1fr 1fr"],.rev-grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
.s-media{position:relative}
.s-media img{width:100%;height:100%;min-height:340px;max-height:460px;object-fit:cover;border-radius:var(--r);box-shadow:var(--sh)}
/* carousel */
.caro{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.caro .track{display:flex;transition:transform .5s cubic-bezier(.4,.1,.2,1)}
.caro .track img{min-width:100%;height:430px;object-fit:cover;border-radius:0}
.caro .track img.pos-top{object-position:center 22%}
.caro .ar{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-sm);z-index:2}
.caro .ar.l{left:14px}.caro .ar.r{right:14px}
.caro .ar svg{width:16px;height:16px;stroke:var(--ink)}
.caro .dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:7px;z-index:2}
.caro .dots b{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s}
.caro .dots b.on{background:#fff;width:20px;border-radius:5px}
.feat{list-style:none;display:grid;gap:22px}
.feat li{display:flex;gap:14px;align-items:flex-start}
.feat .chk{margin-top:2px}
.feat h4{font-size:1.12rem;font-weight:700;margin-bottom:3px}
.feat p{font-size:0.95rem;color:var(--muted)}

/* ---- pain points (rød X) ---- */
.pain{display:grid;gap:14px;max-width:680px;margin:40px auto 0}
.pain .row{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:var(--rs);padding:16px 20px;font-weight:600;font-size:1.02rem;box-shadow:var(--sh-sm);text-align:left}
.pain .x{color:var(--red);font-size:1.2rem;font-weight:800;flex:none}

/* ---- dark CTA band ---- */
.darkband{background:var(--dark);color:#fff;border-radius:var(--r);padding:48px 40px;text-align:center;box-shadow:var(--sh)}
.darkband .eyebrow{color:#EFB65C}
.darkband h2{color:#fff;max-width:26ch;margin:14px auto 12px}
.darkband p{color:rgba(255,255,255,.82);max-width:52ch;margin:0 auto;font-size:1.04rem}
.darkband .codebox{margin-top:22px;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(180,99,77,.18);border:1px dashed var(--clay-soft);border-radius:13px;padding:11px 20px}
.darkband .codebox b{font-size:1.06rem;letter-spacing:.04em;color:#fff}
.darkband .codebox .hl{color:#EFB65C;font-weight:700}
.darkband .cta{margin-top:26px;background:#fff;color:var(--dark)}
.darkband .cta:hover{background:var(--clay-tint)}
.darkband .cta .arw{background:rgba(26,21,19,.14)}
.darkband .cta .arw svg{stroke:var(--dark)}
.darkband .micro{font-size:0.8rem;color:rgba(255,255,255,.55);margin-top:14px}
@media(max-width:620px){.darkband{padding:42px 24px}}

/* ---- included card ---- */
.inc-card{background:var(--white);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:1.1fr 1fr;gap:0;overflow:hidden;box-shadow:var(--sh)}
.inc-card .body{padding:42px 40px}
/* .pic er absolutt-fylt: tekstkolonnen styrer korthøyden — ellers strekker
   portrettbildets egenhøyde kortet til et digert tomrom på brede skjermer */
.inc-card .pic{position:relative;min-height:440px}
.inc-card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.inc-list{list-style:none;display:grid;gap:14px;margin:22px 0 26px}
.inc-list li{display:flex;gap:13px;align-items:flex-start;font-size:1rem}
.inc-list .chk{margin-top:1px}
.pricebar{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;background:var(--sand);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.pricebar .ord{font-size:0.94rem;color:var(--muted)}
.pricebar .ord s{color:var(--red)}
.pricebar .now{font-size:1.55rem;font-weight:800;color:var(--clay-deep);letter-spacing:-0.02em}
.pricebar .now small{font-size:0.86rem;font-weight:600;color:var(--muted);letter-spacing:0}
@media(max-width:880px){.inc-card{grid-template-columns:1fr}.inc-card .pic{order:-1;min-height:280px}.inc-card .body{padding:34px 26px}}

/* ---- reviews ---- */
.rev-head{display:flex;align-items:center;gap:30px;flex-wrap:wrap;justify-content:center;text-align:center;flex-direction:column}
.rev-score{display:inline-flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);border-radius:var(--pill);padding:10px 20px;box-shadow:var(--sh-sm)}
.rev-score .n{font-size:1.5rem;font-weight:800;letter-spacing:-0.02em}
.rev-score .stars{color:var(--gold);letter-spacing:1.5px}
.rev-score small{color:var(--muted);font-weight:500}
.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
@media(max-width:880px){.rev-grid{grid-template-columns:1fr}}
.rev-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;box-shadow:var(--sh-sm)}
.rev-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rev-card .stars{color:var(--gold);letter-spacing:1.5px;font-size:0.96rem}
.rev-card .g{font-size:0.72rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.rev-card p{font-size:0.97rem;color:var(--ink2);line-height:1.55}
.rev-by{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.rev-by b{font-weight:700;font-size:0.95rem;display:block}
.rev-by span{font-size:0.74rem;color:var(--muted)}

/* ---- faq ---- */
.faq{display:grid;gap:11px;max-width:840px;margin:42px auto 0}
.faq details{background:var(--white);border:1px solid var(--line);border-radius:var(--rs);padding:4px 22px;transition:.2s}
.faq details[open]{box-shadow:var(--sh-sm)}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;font-size:1.06rem;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pm{width:28px;height:28px;border-radius:50%;background:var(--clay-tint);color:var(--clay-deep);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none;transition:.3s}
.faq details[open] summary .pm{transform:rotate(45deg);background:var(--clay);color:#fff}
.faq .ans{padding:0 0 20px;color:var(--muted);font-size:0.97rem;max-width:72ch}

/* ---- lokasjon-kort ---- */
.locard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);background:var(--white)}
.locard .mapimg img{width:100%;height:260px;object-fit:cover}
.locard .head{padding:26px 30px 8px;text-align:center}
.locard .nm{font-weight:800;font-size:1.28rem;color:var(--ink)}
.locard .ad{color:var(--muted);font-size:0.95rem;margin-top:6px}
.locard .ad small{display:block;color:var(--muted);opacity:.75;font-size:0.8rem;margin-top:3px}
.locard .foot{padding:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---- footer ---- */
.footer{background:var(--dark);color:rgba(255,255,255,.6);font-size:0.88rem;text-align:center;padding:48px 0 36px}
.footer .wordmark{display:inline-block;font-size:1.15rem;letter-spacing:.42em;text-indent:.42em;color:#fff;line-height:1;margin-bottom:14px;font-weight:600}
.footer .rate{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:600}
.footer .rate .stars{color:var(--gold);letter-spacing:1.5px}
.footer .reg{margin-top:16px;font-size:0.8rem;color:rgba(255,255,255,.45);line-height:1.7}

/* ---- modal popup ---- */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(18,14,12,.55);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.3s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--cream);border-radius:24px;max-width:520px;width:100%;overflow:auto;max-height:92vh;box-shadow:0 50px 100px -30px rgba(0,0,0,.55);transform:translateY(20px) scale(.97);transition:.35s cubic-bezier(.2,.7,.2,1)}
.modal-overlay.show .modal{transform:none}
.modal .mbody{padding:34px 32px;position:relative}
.modal .mbody h3{font-size:2.0rem;line-height:1.03;margin:4px 0 4px;text-align:center}
.modal .close{position:absolute;top:13px;right:15px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:0.95rem;color:var(--muted);transition:.2s}
.modal .close:hover{background:var(--dark);color:#fff}
@media(max-width:620px){.modal .mbody{padding:28px 22px}}

/* reveal */
.reveal{opacity:0;transform:translateY(22px);transition:.65s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}

/* ===== FØR/ETTER (tillegg til malen — Victors regel: alltid før/etter) ===== */
.ba{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);
  border:1px solid var(--line);background:var(--white);aspect-ratio:16/10;
  user-select:none;touch-action:none;cursor:ew-resize}
.ba .lag{position:absolute;inset:0}
.ba .lag img{width:100%;height:100%;object-fit:cover}
.ba .etter{clip-path:inset(0 0 0 var(--x,50%))}
.ba .tag{position:absolute;top:14px;padding:6px 14px;border-radius:var(--pill);
  font-size:0.74rem;font-weight:800;letter-spacing:0.07em;text-transform:uppercase;
  background:rgba(12,32,51,.82);color:#fff}
.ba .tag.f{left:14px}
.ba .tag.e{right:14px;background:var(--clay)}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;
  box-shadow:0 0 0 1px rgba(12,32,51,.2);pointer-events:none}
.ba .handle::after{content:'\2039 \203A';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;
  color:var(--clay);display:grid;place-items:center;font-size:1.05rem;font-weight:800;
  box-shadow:0 6px 18px -6px rgba(12,32,51,.5)}
.folk{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.folk figure{margin:0}
.folk img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);
  border:1px solid var(--line);box-shadow:var(--sh-sm)}
.folk figcaption{margin-top:11px;font-size:0.92rem;color:var(--muted);font-weight:600}
@media(max-width:820px){.folk{grid-template-columns:1fr}}
/* Mobil-vakt (01.10.2026): lange norske ord skal aldri presse siden bredere enn skjermen */
.hero-grid>*,.split>*,.inc-card>*,.rev-grid>*,.folk>*{min-width:0}
h1,h2,h3{overflow-wrap:break-word}
@media(max-width:880px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
/* Hero-vakt (01.10.2026): ekstra høyde fra skjemaet går til nedre rad, ikke luke under H1. Store tall-felt skal være korte (0 kr, 4 uker). */
.hero-grid{grid-template-rows:auto 1fr}
.offer .tile .big{height:auto;min-height:104px;line-height:1.05;hyphens:manual;overflow-wrap:normal;word-break:keep-all}
@media(max-width:480px){.offer .tile .big{min-height:84px}}

/* ---- logo + veiviser (trykkvalg, Badstugutta-fasit) ---- */
.topbar .logo{height:30px;width:auto;margin:0 auto 7px}
.wiz .prog{display:flex;justify-content:space-between;align-items:center;font-size:0.76rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.wiz .prog .bar{flex:1;height:5px;border-radius:9px;background:var(--line);margin-left:12px;overflow:hidden}
.wiz .prog .bar i{display:block;height:100%;width:33%;background:var(--clay);transition:width .3s}
.wiz .q{font-size:1.06rem;font-weight:800;margin:4px 0 12px}
.wiz .scr{display:none}.wiz .scr.on{display:block}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pill{font-family:var(--mont);font-size:0.98rem;font-weight:700;color:var(--ink);background:var(--sand);border:1.5px solid var(--line);border-radius:14px;padding:15px 10px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--clay)}
.pill.sel{background:var(--clay);border-color:var(--clay);color:#fff}
.wiz .back{background:none;border:0;font-family:var(--mont);font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;margin-top:12px;padding:4px 0}
.wiz .ferr{display:none;color:var(--red);font-size:0.82rem;font-weight:600;margin:4px 0 8px}
.offer .tile .big{color:var(--clay-deep)}
.strip .hl,.offer-note,.darkband .eyebrow{color:#F2C4A6}
.footer .alogo{height:26px;width:auto;margin:0 auto 14px;filter:invert(1)}
.footer a{color:#fff;text-decoration:underline}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><img class="logo" src="img/ava-logo.png" alt="AVA Beauty" width="500" height="287"></div></header>
<section class="section"><div class="wrap center" style="max-width:640px">
<span class="eyebrow">Takk for p&aring;meldingen</span>
<h1 class="h-xl" style="margin:14px 0 16px">Du er p&aring; lista!</h1>
<p class="lede" style="margin:0 auto">Vi tar kontakt p&aring; e-post s&aring; snart vi har sett p&aring; p&aring;meldingene. Da f&aring;r du vite mer om platen og videoen, og du kan alltid si nei takk.</p>
</div></section>
</body></html>
