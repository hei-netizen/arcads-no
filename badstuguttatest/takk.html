<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#F6F4F0;--ink:#12293D;--muted:#55677A;--line:#E5E1D8;--clay:#0A395E;--clay-deep:#072A47;--gold:#C8A35B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.brand{background:var(--clay);border-radius:14px;padding:12px 20px 10px;margin-bottom:10px}
.brand img{height:26px;width:auto;display:block;margin:0 auto}
.stars{color:var(--gold);letter-spacing:1px;font-size:0.92rem;margin-bottom:34px}
.stars span{color:var(--muted);letter-spacing:0;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(7,42,71,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-weight:800;font-size:1.65rem;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.hint{margin-top:16px;font-size:0.88rem}
.book{display:inline-block;margin-top:26px;background:var(--clay);color:#fff;text-decoration:none;font-weight:700;font-size:0.98rem;border-radius:999px;padding:15px 28px;box-shadow:0 12px 26px -14px rgba(7,42,71,.9);transition:.2s}
.book:hover{background:var(--clay-deep)}
.back{display:inline-block;margin-top:14px;font-weight:600;font-size:0.86rem;color:var(--clay-deep);text-decoration:none}
</style>
</head>
<body>
  <div class="brand"><img src="img/logo-badstugutta.png" alt="Badstugutta"></div>
  <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733; <span>5 av 5 stjerner p&aring; Google</span></div>
  <div class="card">
    <span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>Takk! Tilbudet ditt er p&aring; vei</h1>
    <p>Vi ser p&aring; svarene dine og tar kontakt innen 24 timer.</p>
    <p class="hint">Bestiller du badstue f&oslash;r 31. desember, f&aring;r du Kaldkulp Pro 100 med p&aring; kj&oslash;pet.</p>
    <a class="book" href="https://book.badstugutta.no/gratis-badstukonsultasjon" target="_blank" rel="noopener">Vil du heller velge tidspunkt selv? Book en prat</a><br>
    <a class="back" href="index.html">Tilbake til badstuene</a>
  </div>
</body>
</html>
