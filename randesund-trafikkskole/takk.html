<style>
:root{--cream:#F2F2F0;--ink:#141414;--muted:#6B6B6B;--line:#E0E0DC;--clay:#1E1E1E;--clay-deep:#000}
*{box-sizing:border-box;margin:0;padding:0}

h1{font-weight:800;font-size:1.55rem;letter-spacing:-0.01em;line-height:1.18;margin-bottom:12px;overflow-wrap:break-word}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.hint{margin-top:18px;font-size:0.87rem}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:0.9rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px;transition:.2s}
