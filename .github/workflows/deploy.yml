# Deployer arcads.no til GitHub Pages med minifisert HTML/CSS/JS.
# Kildefilene i repoet forblir lesbare — kun det som publiseres komprimeres
# (fjerner kommentarer, whitespace og gjør koden uleselig i view-source).
name: Deploy minifisert

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Generer llms-full.txt (all sidetekst for AI-crawlere)
        run: python3 scripts/build_llms_full.py

      - name: Bygg minifisert kopi
        run: |
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          npx --yes html-minifier-terser@7 \
            --input-dir _site --output-dir _site --file-ext html \
            --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true
          find _site \( -name "*.css" -o -name "*.js" \) \
            -exec npx --yes esbuild@0.25 --minify --allow-overwrite {} --outfile={} \;

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # GitHub Pages svarer av og til «Deployment failed, try again later».
      # Prøver opptil 3 ganger (pause 1 og 2 min) før jobben feiler — da slipper vi
      # manuelle «Ny deploy (forsøk N)»-commits og feil-e-poster ved forbigående feil.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før forsøk 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Vent før forsøk 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 120

      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Varsler Bing/IndexNow om alle URL-er i sitemap etter hver deploy —
      # ChatGPT-browsing bruker Bing-indeksen, så rask indeksering der = GEO.
      - name: IndexNow-ping (Bing)
        if: success()
        run: |
          KEY=d6556a3e3dca895298f5bfa38c182269
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"arcads.no\",\"key\":\"$KEY\",\"keyLocation\":\"https://arcads.no/$KEY.txt\",\"urlList\":$URLS}" \
            -o /dev/null -w "IndexNow HTTP %{http_code}\n" || true
