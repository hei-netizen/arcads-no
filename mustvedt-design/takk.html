<style>
:root{--cream:#f4f5f3;--ink:#101418;--muted:#5f6870;--line:#cfd4d3;--clay:#e8501b;--clay-deep:#b63a0f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Schibsted Grotesk',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1;margin-bottom:34px}
.logo svg{color:var(--clay)}
.logo .n2{font-weight:400}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:44px 30px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(15,23,32,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-weight:800;font-size:1.7rem;letter-spacing:-0.02em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.hint{margin-top:16px;font-size:0.9rem}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:0.92rem;color:var(--clay-deep);border:1px solid var(--line);border-radius:999px;padding:11px 24px;text-decoration:none}
