<style>
:root{--cream:#F3F4F6;--ink:#141C24;--muted:#5C6B7A;--line:#DFE3E8;--clay:#27374B;--clay-deep:#16222F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{height:46px;width:auto;margin-bottom:30px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(20,28,36,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-weight:800;font-size:1.7rem;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:40ch;margin:0 auto}
.hint{margin-top:18px;font-size:0.85rem}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:0.9rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px;transition:.2s}
.back:hover{border-color:var(--clay)}
</style>
