<style>
:root{--cream:#F3F5F8;--ink:#0E1C2E;--muted:#5B6B7E;--line:#DDE3EA;--clay:#1B3F6C;--orange:#FDA23C;--dark:#071523}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.logo{height:42px;width:auto;margin:0 auto 34px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 30px;max-width:500px;width:100%;box-shadow:0 24px 54px -32px rgba(7,21,35,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--orange);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:var(--dark)}
h1{font-weight:800;font-size:1.7rem;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:40ch;margin:0 auto}
ol{list-style:none;text-align:left;display:grid;gap:12px;margin:26px auto 0;max-width:360px;padding-top:22px;border-top:1px solid var(--line)}
ol li{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:0.95rem}
ol li span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--clay);color:#fff;font-size:0.8rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.back{display:inline-block;margin-top:28px;font-weight:700;font-size:0.9rem;color:var(--clay);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px;transition:.2s}
.back:hover{border-color:var(--clay)}
.mail{margin-top:16px;font-size:0.85rem;color:var(--muted)}
.mail a{color:var(--clay);font-weight:700}
</style>
