<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Takk! — Auto Industri AS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2305418C'/><text y='.9em' x='50%25' text-anchor='middle' font-size='40' font-family='Helvetica,Arial' font-weight='700' fill='%23fff'>AI</text></svg>">
<!-- Ingen Meta-pixel: dette er et forslag fra Arcads, ikke Auto Industris eiendom ennå. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#EEF1F6;--ink:#0E1A2E;--muted:#5A6680;--line:#DCE1EB;--clay:#05418C;--clay-deep:#032E66;--gold:#E0221F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.wordmark{font-size:1.32rem;letter-spacing:.42em;text-indent:.42em;font-weight:600;margin-bottom:6px}
.stars{color:var(--muted);font-size:0.9rem;margin-bottom:38px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(10,29,60,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:var(--clay);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-weight:800;font-size:1.7rem;letter-spacing:-0.01em;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.hint{margin-top:18px;font-size:0.85rem}
.back{display:inline-block;margin-top:26px;font-weight:700;font-size:0.9rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px;transition:.2s}
.back:hover{border-color:var(--clay);color:var(--clay)}
.callbox{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
.callbox .lede{font-size:0.95rem;color:var(--ink);font-weight:600;margin-bottom:14px}
.call{display:inline-flex;align-items:center;gap:10px;background:var(--clay);color:#fff;text-decoration:none;font-weight:800;font-size:1.12rem;letter-spacing:.01em;border-radius:999px;padding:16px 30px;box-shadow:0 12px 26px -14px rgba(5,65,140,.9);transition:.2s}
.call:hover{background:var(--clay-deep);transform:translateY(-1px)}
.call svg{width:19px;height:19px;fill:#fff}
.hours{margin-top:14px;font-size:0.82rem;color:var(--muted)}
</style>
<!-- Microsoft Clarity (prosjekt «Arcads» y2br1kx6o7) -->
<script type="text/javascript">
(function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window, document, "clarity", "script", "y2br1kx6o7");
</script>
</head>
<body>
  <div class="wordmark">AUTO INDUSTRI</div>
  <div class="stars">Bilskadeverksted i Leirvik sentrum &middot; Stord</div>
  <div class="card">
    <span class="chk"><svg viewBox="0 0 24 24" fill="none" stroke-width="3"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <h1>Takk! Vi har mottatt henvendelsen din</h1>
    <p>Vi tar kontakt s&aring; fort vi kan og hjelper deg videre med skaden.</p>
    <div class="callbox">
      <div class="lede" id="callLede">Haster det? Ring oss direkte</div>
      <a class="call" id="callBtn" href="tel:53411069">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
        Ring 53 41 10 69
      </a>
      <div class="hours" id="callHours">&Aring;pent man&ndash;ons 07:00&ndash;15:30, tor 07:00&ndash;15:00, fre 07:00&ndash;13:00</div>
    </div>
    <a class="back" href="https://www.auto-industri.no/">G&aring; til auto-industri.no</a>
  </div>
<script>
/* Tidsstyrt kontakt-CTA (Oslo-tid): i åpningstiden vises hovednummeret,
   utenom åpningstid vises vakttelefonen 482 40 575 — begge står på auto-industri.no.
   Åpningstider fra nettsiden: man-ons 07:00-15:30, tor 07:00-15:00, fre 07:00-13:00. */
(function(){
  var f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Oslo',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
  var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var dager={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:0};
  var dag=dager[p.weekday], min=parseInt(p.hour,10)*60+parseInt(p.minute,10);
  var stengt={1:930,2:930,3:930,4:900,5:780}[dag];
  var apent = stengt!==undefined && min>=420 && min<stengt;
  if(apent) return;
  document.getElementById('callLede').textContent='Verkstedet er stengt akkurat nå';
  var btn=document.getElementById('callBtn');
  btn.href='tel:48240575';
  btn.innerHTML=btn.querySelector('svg').outerHTML+' Vakttelefon 482 40 575';
  document.getElementById('callHours').innerHTML='Hovednummeret 53 41 10 69 er betjent man&ndash;ons 07:00&ndash;15:30, tor 07:00&ndash;15:00 og fre 07:00&ndash;13:00.';
})();
</script>
</body>
</html>
