<style>
:root{--cream:#FFF6F1;--ink:#2B0F24;--muted:#8A7380;--line:#F0E1E8;--clay:#FF1E93;--clay-deep:#C8126F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',-apple-system,sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{height:44px;margin-bottom:34px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 34px;max-width:480px;width:100%;box-shadow:0 24px 54px -32px rgba(43,15,36,.42)}
.chk{width:58px;height:58px;border-radius:50%;background:linear-gradient(90deg,#FF1E93,#FF8A3D);display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
.chk svg{width:28px;height:28px;stroke:#fff}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.8rem;line-height:1.15;margin-bottom:12px}
p{color:var(--muted);font-size:1.0rem;max-width:38ch;margin:0 auto}
.back{display:inline-block;margin-top:26px;font-weight:800;font-size:0.9rem;color:var(--clay-deep);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 24px}
</style>
